# routebench-web — the customer-facing app. Deploys separately from the API.
#
#   fly deploy -c fly.web.toml \
#     --build-arg NEXT_PUBLIC_API_BASE=https://routebench.fly.dev
#
# The API must allow this origin back:
#   fly secrets set WEB_ORIGIN=https://routebench-web.fly.dev -a routebench
app = "routebench-web"
primary_region = "dfw"

[build]
  dockerfile = "web/Dockerfile"

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/"
