name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff check
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

      - name: Mypy
        run: uv run mypy src/routebench

      # tests/adversary/ is excluded: those tests are findings from the
      # robustness harness and are EXPECTED to fail until the defect they
      # document is fixed. Including them would make CI red by design. When a
      # defect is fixed, promote its test out of tests/adversary/ so it becomes
      # a permanent regression guard here — see ROBUSTNESS.md.
      - name: Pytest
        run: uv run pytest tests/ -v --tb=short --ignore=tests/adversary

  security:
    name: security (SAST + SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      # Static analysis (blocking). The codebase has a clean baseline; any
      # unsuppressed medium-or-higher finding fails the build. Known-safe
      # Markup() calls carry `# nosec B704` with justification, and the escaping
      # they rely on is pinned in tests/security/test_chart_svg_escaping.py.
      - name: Bandit (SAST)
        run: uvx bandit -r src/routebench -ll

      # Dependency CVE scan (advisory for now). Remediation lands via dependabot
      # PRs one bump at a time (see .github/dependabot.yml) rather than a single
      # risky lockfile change; flip continue-on-error off once the baseline is
      # clean so new advisories block.
      - name: pip-audit (SCA)
        continue-on-error: true
        run: |
          uv export --format requirements-txt --no-hashes --no-emit-project > /tmp/reqs.txt
          uvx pip-audit -r /tmp/reqs.txt

  web:
    name: web (typecheck + lint + e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # The e2e suite serves the built app itself and mocks the API, so it needs
      # no OSRM, no LLM key, and no network map tiles — the tile source is
      # stubbed and assertions are on layer state rather than pixels.
      - name: Start the app
        run: npx next start -p 3111 &

      - name: Wait for the app
        run: npx wait-on http://localhost:3111 --timeout 60000

      - name: E2E
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
