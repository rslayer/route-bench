# fly.osrm.toml — OSRM sidecar (routebench-osrm)
#
# Built from osrm.Dockerfile, which bakes the road-network graph into the image.
# No volume, no manual graph provisioning: the graph ships with the engine, and
# the runtime path (/data/region.osrm) is produced by that build. Reachable from
# the API over Fly's private network at http://routebench-osrm.internal:5000.
#
# To change region, override the build arg (see osrm.Dockerfile):
#   fly deploy -c fly.osrm.toml \
#     --build-arg OSRM_PBF_URL=https://download.geofabrik.de/<region>-latest.osm.pbf

app = "routebench-osrm"
primary_region = "dfw"

[build]
  dockerfile = "osrm.Dockerfile"

[http_service]
  internal_port = 5000
  force_https = false
  # Always on, not auto-stopped. The API reaches OSRM over .internal DNS, which
  # bypasses Fly's proxy — so the proxy's idle timer never sees that traffic and
  # would auto-stop a machine the API is actively using, stranding matrix calls
  # until it cold-starts. A single always-on sidecar is what min=1 already wants;
  # this just removes the stop/start churn that .internal traffic can't prevent.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

# Memory must exceed the loaded graph; a US-state MLD graph is comfortable at
# 2gb, a metro extract needs far less. Raise this if osrm-routed is OOM-killed
# on boot with a larger region.
[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
