# fly.toml — main RouteBench app
#
# Streamlit (port 8501) is exposed as a raw TCP service.  In production,
# add a reverse proxy (Nginx/Caddy) or use Fly's http_service with path
# routing to serve both FastAPI and Streamlit under a single domain.
# For now, Streamlit is accessible directly on port 8501.

app = "routebench"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[services]]
  internal_port = 8501
  protocol = "tcp"

  [[services.ports]]
    port = 8501

[env]
  STORAGE_BACKEND = "s3"
  OSRM_HOST = "http://routebench-osrm.internal:5000"
  LOG_LEVEL = "INFO"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
