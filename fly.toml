# fly.toml — main RouteBench app

app = "routebench"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[services]]
  internal_port = 8501
  protocol = "tcp"

  [[services.ports]]
    port = 8501

[env]
  STORAGE_BACKEND = "s3"
  OSRM_HOST = "http://routebench-osrm.internal:5000"
  LOG_LEVEL = "INFO"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
