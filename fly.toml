# fly.toml — RouteBench API (routebench)
#
# One public service on 8000 (the FastAPI app). The legacy Streamlit surface on
# 8501 is gone.
#
# Secrets are NOT in this file. Set them once with `fly secrets set` before the
# first deploy (see DEPLOY.md): R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY,
# R2_ENDPOINT, WEB_ORIGIN, and optionally ANTHROPIC_API_KEY and ADMIN_TOKEN.

app = "routebench"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  # Readiness, not liveness: /healthz reports 503 when storage or OSRM is
  # unreachable, so Fly holds traffic off a machine that would only serve
  # degraded results.
  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

[env]
  STORAGE_BACKEND = "s3"
  OSRM_HOST = "http://routebench-osrm.internal:5000"
  LOG_LEVEL = "INFO"
  # The matrix cache lives on the mounted volume so it survives deploys instead
  # of warming cold each time. Sessions go to R2 (STORAGE_BACKEND=s3); only the
  # cache is on local disk.
  MATRIX_CACHE_PATH = "/data/matrix-cache"

# One machine, one volume — deliberately. The S3 budget-ledger append is
# single-writer, so the API is not horizontally scaled; min/max one machine.
[mounts]
  source = "routebench_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
