# fly.toml — RouteBench API (routebench)
#
# One public service on 8000 (the FastAPI app). The legacy Streamlit surface on
# 8501 is gone.
#
# Secrets are NOT in this file. Set them once with `fly secrets set` before the
# first deploy (see DEPLOY.md): R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY,
# R2_ENDPOINT, WEB_ORIGIN, GOOGLE_MAPS_API_KEY, and optionally ANTHROPIC_API_KEY
# and ADMIN_TOKEN.
#
# This deploy runs on the Google matrix engine (MATRIX_ENGINE=google below) for
# continent-wide coverage without self-hosting a routing graph. GOOGLE_MAPS_API_KEY
# is therefore REQUIRED — the app fails to start without it — and the OSRM sidecar
# (fly.osrm.toml) is optional. Switch MATRIX_ENGINE back to "osrm" to run on the
# self-hosted graph instead; then the key is not needed and the sidecar is.

app = "routebench"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  # Readiness, not liveness: /healthz reports 503 when storage or OSRM is
  # unreachable, so Fly holds traffic off a machine that would only serve
  # degraded results.
  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

[env]
  STORAGE_BACKEND = "s3"
  # Google Routes: continent-wide coverage + live traffic, no self-hosted graph.
  # Bills per element — see DEPLOY.md for the cost model. GOOGLE_MAPS_API_KEY is a
  # required secret. Set to "osrm" to use the self-hosted sidecar instead.
  MATRIX_ENGINE = "google"
  # Only consulted when MATRIX_ENGINE = "osrm"; harmless otherwise. Left set so
  # switching back to the sidecar needs no further change here.
  OSRM_HOST = "http://routebench-osrm.internal:5000"
  LOG_LEVEL = "INFO"
  # The matrix cache lives on the mounted volume so it survives deploys instead
  # of warming cold each time. Sessions go to R2 (STORAGE_BACKEND=s3); only the
  # cache is on local disk.
  MATRIX_CACHE_PATH = "/data/matrix-cache"

# One machine, one volume — deliberately. The S3 budget-ledger append is
# single-writer, so the API is not horizontally scaled; min/max one machine.
[mounts]
  source = "routebench_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
