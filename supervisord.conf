[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0

[program:fastapi]
command=uvicorn routebench.app.api.app:create_app --factory --host 0.0.0.0 --port 8000
directory=/app
environment=PYTHONPATH="/app/src"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true

[program:streamlit]
command=streamlit run src/routebench/app/streamlit_app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
directory=/app
environment=PYTHONPATH="/app/src"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
